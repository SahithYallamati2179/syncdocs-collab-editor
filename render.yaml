# Render blueprint for the sync server.
#
# The Next.js front end is not described here: it belongs on a serverless or
# static host. This file covers the piece that genuinely needs a long-lived
# process, because a WebSocket relay cannot run on a serverless function.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.

services:
  - type: web
    name: syncdocs-sync
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Render injects PORT; config.ts reads it.
      - key: AUTH_MODE
        value: dev

      # IMPORTANT for any real deployment.
      #
      # The free plan has an ephemeral filesystem, so the default `file` driver
      # loses every document -- and every ACL, meaning ownership and all your
      # invitations -- on each redeploy and each idle spin-down. Set both of
      # these in the dashboard, and run apps/server/sql/schema.sql once:
      #
      #   STORAGE_DRIVER=postgres
      #   DATABASE_URL=<session pooler string, port 5432>
      #
      # Both are `sync: false` deliberately. A hardcoded `value: file` here is
      # blueprint-managed, so re-syncing the blueprint would quietly revert a
      # dashboard switch to Postgres and start dropping data again. Left unset,
      # config.ts falls back to the file driver, which is the same safe default
      # without the footgun.
      - key: STORAGE_DRIVER
        sync: false
      - key: DATABASE_URL
        sync: false

      # Lock this to the deployed web origin. The default of "*" is fine for
      # local development and too loose for a public deployment.
      - key: CORS_ORIGIN
        sync: false

      # Only needed when AUTH_MODE=supabase.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
